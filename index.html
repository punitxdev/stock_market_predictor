<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Predict Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.15);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, 50px) scale(1.1);
            }
        }

        .main-wrapper {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
            justify-content: center;
            align-items: flex-start;
            z-index: 1;
            position: relative;
        }

        @media (max-width: 800px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #results {
            display: none;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #a78bfa, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #f8fafc;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        button:active {
            transform: translateY(0);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #predictionsList {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
            margin-top: 15px;
        }

        #predictionsList::-webkit-scrollbar {
            width: 6px;
        }

        #predictionsList::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        #predictionsList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        #predictionsList::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .result-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
        }

        .trend-up {
            color: var(--accent);
        }

        .trend-down {
            color: #ef4444;
        }

        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="main-wrapper">
        <div class="container" id="formContainer">
            <h1>Stock Market Predictor</h1>
            <p class="subtitle">Linear Regression Predictor</p>

            <div class="input-group">
                <label for="stock">Stock Ticker</label>
                <input type="text" id="stock" value="AAPL" autocomplete="off">
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem; font-size: 0.75rem;">
                    Examples: <b>AAPL</b> (Apple), <b>TSLA</b> (Tesla), <b>GOOGL</b> (Google), <b>AMZN</b> (Amazon),
                    <b>MSFT</b> (Microsoft)
                </small>
            </div>

            <div class="input-group">
                <label for="days">Future Days to Predict</label>
                <input type="number" id="days" value="1" min="1" max="30">
            </div>

            <button id="predictBtn" onclick="runPrediction()">
                <span id="btnText">Initialize Model Prediction 🚀</span>
                <div id="btnSpinner" class="spinner"></div>
            </button>

            <div id="errorBox" class="error-msg"></div>
        </div>

        <div class="container" id="results">
            <h2>Prediction Scope</h2>
            <div class="result-card">
                <div>
                    <div class="result-label">Current Close Price</div>
                    <div id="currentDate" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Date: --
                    </div>
                </div>
                <span class="result-value" id="currentPrice">$0.00</span>
            </div>

            <div id="predictionsList"></div>
        </div>
    </div>

    <script>
        async function runPrediction() {
            const stock = document.getElementById('stock').value.toUpperCase();
            const days = document.getElementById('days').value;
            const predictBtn = document.getElementById('predictBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const results = document.getElementById('results');
            const errorBox = document.getElementById('errorBox');
            const currentPriceEl = document.getElementById('currentPrice');
            const predictionsList = document.getElementById('predictionsList');

            if (!stock) return;

            const originalBtnText = "Initialize Model Prediction 🚀";

            predictBtn.style.opacity = '0.7';
            predictBtn.style.cursor = 'not-allowed';
            btnSpinner.style.display = 'inline-block';

            if (results.style.display === 'block') {
                results.style.opacity = '0.5';
            } else {
                results.style.display = 'none';
            }
            errorBox.style.display = 'none';

            try {
                // Check if model already exists to give custom status text
                const checkRes = await fetch('/check_model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stock: stock })
                });
                const checkData = await checkRes.json();

                if (checkData.exists) {
                    btnText.innerText = "Predicting...";
                } else {
                    btnText.innerText = "Loading the model...";
                }

                // Actually run prediction
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stock: stock, future_days: days })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server error occurred');
                }

                currentPriceEl.innerText = `$${data.current_price.toFixed(2)}`;
                document.getElementById('currentDate').innerText = `Date: ${data.current_date}`;
                predictionsList.innerHTML = '';
                let prevPrice = data.current_price;

                data.predictions.forEach((pred, index) => {
                    const diff = pred - prevPrice;
                    const trendClass = diff >= 0 ? 'trend-up' : 'trend-down';
                    const icon = diff >= 0 ? '↗' : '↘';

                    predictionsList.innerHTML += `
                        <div class="result-card" style="margin-top: 0.5rem; background: rgba(0,0,0,0.15); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                            <span class="result-label" style="color: white; font-weight: 600;">Day ${index + 1} Target</span>
                            <div style="text-align: right;">
                                <div class="result-value" style="font-size: 1.25rem;">$${pred.toFixed(2)}</div>
                                <div class="${trendClass}" style="font-size: 0.85rem; font-weight: 600; margin-top: 0.25rem;">
                                    ${icon} ${Math.abs(diff).toFixed(2)}
                                </div>
                            </div>
                        </div>
                    `;
                    prevPrice = pred;
                });

                if (results.style.display !== 'block') {
                    results.style.display = 'block';
                    results.style.animation = 'none';
                    results.offsetHeight; /* trigger reflow */
                    results.style.animation = null;
                }
                results.style.opacity = '1';

            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.style.display = 'block';
                results.style.display = 'none';
            } finally {
                btnText.innerText = originalBtnText;
                btnSpinner.style.display = 'none';
                predictBtn.style.opacity = '1';
                predictBtn.style.cursor = 'pointer';
            }
        }
    </script>
</body>

</html>
